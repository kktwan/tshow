plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.t'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 수집·병합은 SQL을 직접 다룬다 (JdbcClient). 스키마는 Flyway 마이그레이션으로 관리한다
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 공공데이터 API(KOPIS, TourAPI, 문화포털) 호출
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	// 로컬 개발용 자동 재시작 (developmentOnly는 bootJar/배포 이미지에 포함되지 않는다)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// 벡터 색인·AI 추천은 데이터 모델과 색인 설계를 확정한 뒤에 추가한다 (CLAUDE.md 참고)
	// implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	// implementation 'org.springframework.ai:spring-ai-starter-vector-store-qdrant'
	// implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
}

// Spring AI를 추가할 때 주석을 풀 것 (tcine은 2.0.1 사용, Spring Boot 4 용)
// dependencyManagement {
// 	imports {
// 		mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
// 	}
// }

tasks.named('test') {
	useJUnitPlatform()
}
