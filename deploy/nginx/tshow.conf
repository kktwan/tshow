# tshow 전용 가상 호스트. 서버의 /data/infra/nginx/conf.d/tshow.conf 로 둔다.
# 인증서를 발급받기 전에는 아래 HTTPS(443) 서버 블록을 빼고 80 블록만 적용한다 (deploy/README.md 참고).

# ───── 호출 제한 (http 영역. 이 파일은 conf.d 에서 http 안으로 들어간다) ─────
# 검색어(q)가 있는 요청만 센다. 검색마다 임베딩 호출 비용이 들기 때문이다. 검색어가 없으면 키가 비어 제한하지 않는다.
map $arg_q $tshow_search_key {
    default $binary_remote_addr;
    ""      "";
}
# 한 사람(IP)이 분당 30번까지 검색한다. 한꺼번에 15번까지는 바로 받아 준다(버튼을 연달아 누르는 정도).
limit_req_zone $tshow_search_key zone=tshow_search:10m rate=30r/m;
# 그 밖의 모든 요청(화면·정적 파일·API). 사람이 쓰는 수준에서는 닿지 않는 값이다.
limit_req_zone $binary_remote_addr zone=tshow_general:10m rate=20r/s;
# AI 추천(Gemini 호출)은 더 엄격하게: 분당 6번, 한꺼번에 3번까지. 앱에도 사람별·전체 하루 한도가 있다(tshow.recommend).
limit_req_zone $binary_remote_addr zone=tshow_ai:10m rate=6r/m;

# HTTP (80) -> Let's Encrypt ACME Challenge 처리 및 HTTPS 리다이렉트
server {
    listen 80;
    server_name tshow.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443)
server {
    listen 443 ssl;
    http2 on;
    server_name tshow.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/tshow.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tshow.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # 현재 활성 슬롯 (tshow-blue 또는 tshow-green) 불러오기 (Jenkins 가 이 파일을 바꾸고 reload 한다)
    include /etc/nginx/conf.d/tshow-url.inc;

    # 제한을 넘으면 503 대신 429 로 알린다 (이 서버 블록에만 적용)
    limit_req_status 429;
    limit_req_log_level warn;
    error_page 429 @tshow_busy;

    location @tshow_busy {
        default_type text/plain;
        charset utf-8;
        add_header Retry-After 5 always;
        return 429 "요청이 너무 많아요. 잠시 뒤에 다시 시도해 주세요.\n";
    }

    # 보안 헤더 (이 서버 블록의 location 중 add_header 를 따로 쓰는 곳은 위 @tshow_busy 뿐이다)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 위치는 이 사이트에서만(내 주변), 카메라·마이크는 쓰지 않는다
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # 운영 점검용 주소(actuator)는 밖에서 열지 않는다. 배포 헬스체크는 컨테이너 안에서 직접 부르므로 영향이 없다
    location /actuator {
        return 404;
    }

    # 브라우저가 기본으로 찾는 /favicon.ico 는 SVG 아이콘으로 보낸다
    location = /favicon.ico {
        return 301 /favicon.svg;
    }

    # AI 추천 요청 (화면 조각 /recommend, API /api/recommend)
    location ~ ^/(api/)?recommend$ {
        limit_req zone=tshow_ai burst=3 nodelay;
        limit_req zone=tshow_general burst=60 nodelay;

        proxy_pass http://$tshow_url:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # AI 응답을 기다리는 시간(앱의 tshow.recommend.timeout-seconds 보다 길게)
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=tshow_search burst=15 nodelay;
        limit_req zone=tshow_general burst=60 nodelay;

        proxy_pass http://$tshow_url:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
