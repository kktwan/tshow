<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${event.title + ' · tshow'})}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<main class="wrap page page-detail">

    <a class="back" th:href="@{/}"
       onclick="if (document.referrer.indexOf(location.host) > -1) { history.back(); return false; }">← 목록으로</a>

    <article class="detail">
        <div class="detail-cover">
            <img th:if="${event.imageUrl != null}" th:src="${event.imageUrl}" th:alt="${event.title}"
                 referrerpolicy="no-referrer" onerror="this.remove()">
            <span class="detail-cover-fallback" aria-hidden="true"
                  th:text="${event.kind == 'EXHIBITION'} ? '🖼️' : (${event.kind == 'PERFORMANCE'} ? '🎭' : '🎪')">🎭</span>
        </div>

        <div class="detail-main">
            <p class="detail-tags">
                <span class="tag tag-gray" th:text="${event.kindName}">공연</span>
                <span class="tag tag-purple" th:if="${event.categoryName != event.kindName}" th:text="${event.categoryName}">연극</span>
                <span class="tag" th:if="${event.status != null}" th:text="${event.status}"
                      th:classappend="'tone-' + ${event.statusTone}">진행 중</span>
                <span class="tag tag-green" th:if="${event.priceType == 'FREE'}">무료</span>
            </p>
            <h1 class="detail-title" th:text="${event.title}">제목</h1>

            <dl class="props">
                <div class="prop">
                    <dt><span>📅</span>기간</dt>
                    <dd th:text="${event.period}">10.28 (수)</dd>
                </div>
                <div class="prop" th:if="${event.scheduleText != null}">
                    <dt><span>🕒</span>공연 시간</dt>
                    <dd class="prewrap" th:text="${event.scheduleText}">화~금 20:00</dd>
                </div>
                <div class="prop" th:if="${event.venueName != null or event.address != null}">
                    <dt><span>📍</span>장소</dt>
                    <dd>
                        <span th:text="${event.venueName}">시흥아트센터</span>
                        <span class="muted block" th:if="${event.address != null}" th:text="${event.address}">주소</span>
                        <a class="link" th:if="${mapUrl != null}" th:href="${mapUrl}" target="_blank" rel="noopener noreferrer">지도에서 보기 ↗</a>
                    </dd>
                </div>
                <div class="prop" th:if="${event.priceText != null}">
                    <dt><span>🎫</span>가격</dt>
                    <dd class="prewrap" th:text="${event.priceText}">전석 20,000원</dd>
                </div>
                <div class="prop" th:if="${event.ageText != null}">
                    <dt><span>🔖</span>관람 연령</dt>
                    <dd th:text="${event.ageText}">만 7세 이상</dd>
                </div>
                <div class="prop" th:if="${event.runtimeText != null}">
                    <dt><span>⏱️</span>러닝타임</dt>
                    <dd th:text="${event.runtimeText}">90분</dd>
                </div>
                <div class="prop" th:if="${event.castText != null}">
                    <dt><span>👥</span>출연</dt>
                    <dd class="prewrap" th:text="${event.castText}">출연진</dd>
                </div>
                <div class="prop" th:if="${event.hostText != null}">
                    <dt><span>🏢</span>주최·제작</dt>
                    <dd th:text="${event.hostText}">주최</dd>
                </div>
            </dl>

            <div class="actions" th:if="${!event.ticketLinks.isEmpty() or event.infoUrl != null}">
                <a class="btn btn-primary" th:each="t : ${event.ticketLinks}" th:href="${t.url()}"
                   target="_blank" rel="noopener noreferrer"
                   th:text="${t.name() != null ? t.name() + ' 예매' : '예매하기'} + ' ↗'">예매하기 ↗</a>
                <a class="btn" th:if="${event.infoUrl != null}" th:href="${event.infoUrl}"
                   target="_blank" rel="noopener noreferrer">자세한 정보 ↗</a>
            </div>
        </div>
    </article>

    <section class="detail-body" th:if="${event.description != null}">
        <h2>소개</h2>
        <p class="prewrap" th:text="${event.description}">소개</p>
    </section>

    <p class="source-note" th:if="${!event.sources.isEmpty()}">
        출처 · <span th:text="${#strings.listJoin(event.sources, ', ')}">공연예술통합전산망(KOPIS)</span>
    </p>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
