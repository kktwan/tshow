<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('tshow')}"></head>
<body>
<svg th:replace="~{fragments :: icons}"></svg>
<header th:replace="~{fragments :: header}"></header>

<main class="wrap page">
    <div class="empty empty-page">
        <div class="empty-icon"><svg class="i"><use href="#search"/></svg></div>
        <p class="empty-title" th:text="${message != null ? message : '페이지를 찾을 수 없어요'}">페이지를 찾을 수 없어요</p>
        <p class="empty-sub">주소가 바뀌었거나 이미 끝난 행사일 수 있어요.</p>
        <a class="btn btn-primary" th:href="@{/}">처음으로</a>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
