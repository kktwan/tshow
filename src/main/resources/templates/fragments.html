<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${title}">tshow</title>
    <meta name="description" th:content="${meta != null and meta.description != null ? meta.description : '공연·전시·축제 일정을 날짜·지역·분위기로 찾아 보세요.'}">
    <meta name="robots" content="noindex,follow" th:if="${meta != null and meta.noindex}">
    <link rel="canonical" th:if="${meta != null and meta.canonical != null and site != null}" th:href="${site.baseUrl + meta.canonical}">
    <meta property="og:site_name" content="tshow">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${meta != null and meta.description != null ? meta.description : '공연·전시·축제 일정을 날짜·지역·분위기로 찾아 보세요.'}">
    <meta property="og:url" th:if="${meta != null and meta.canonical != null and site != null}" th:content="${site.baseUrl + meta.canonical}">
    <meta property="og:image" th:if="${meta != null and meta.image != null}" th:content="${meta.image}">
    <meta name="twitter:card" th:content="${meta != null and meta.image != null ? 'summary_large_image' : 'summary'}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- 화면 전체에서 쓰는 아이콘 모음. <svg class="i"><use href="#이름"/></svg> 로 쓴다 -->
<svg th:fragment="icons" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6d5dfc"/>
            <stop offset="1" stop-color="#ff6fa8"/>
        </linearGradient>
    </defs>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8z"/><path d="M14 6v2M14 11v2M14 16v2"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="building" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="sparkles" viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9L11 3z"/><path d="M19 3v4M17 5h4M19 15v4M17 17h4"/></symbol>
    <symbol id="arrow-up-right" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
    <symbol id="chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="tag" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/></symbol>
    <symbol id="phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<header class="topbar" th:fragment="header">
    <div class="wrap topbar-inner">
        <a class="brand" th:href="@{/}" aria-label="tshow 처음으로">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="9" fill="url(#brand-gradient)"/>
                <path d="M8 12.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1.6a2 2 0 0 0 0 3.8v1.6a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2v-1.6a2 2 0 0 0 0-3.8z"
                      fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M17 11v10" stroke="#fff" stroke-width="1.6" stroke-dasharray="1.6 2" stroke-linecap="round"/>
            </svg>
            <span class="brand-name">tshow</span>
        </a>
        <span class="topbar-note">공연 · 전시 · 축제를 한곳에서</span>
    </div>
</header>

<footer class="footer" th:fragment="footer">
    <div class="wrap footer-inner">
        <div class="footer-row">
            <p class="footer-brand">tshow</p>
            <p class="footer-links">
                <a th:href="@{/about}">서비스 안내 · 데이터 출처 · 개인정보</a>
            </p>
            <p class="footer-links" th:if="${site != null}">
                <span th:if="${site.updatedLabel != null}">데이터 갱신 <strong th:text="${site.updatedLabel}">10.8 (목) 03:12</strong></span>
                <span th:if="${site.contactEmail != ''}">정정·삭제 요청 <a th:href="'mailto:' + ${site.contactEmail}" th:text="${site.contactEmail}">mail@example.com</a></span>
            </p>
        </div>
        <p>공연·전시·행사 정보는 공연예술통합전산망(KOPIS), 한국관광공사, 한국문화정보원이 제공한 자료를 가공해 보여 드려요.
            일정과 요금은 바뀔 수 있으니 예매하거나 방문하기 전에 꼭 확인해 주세요.</p>
        <p class="footer-copy">© <span th:text="${site != null ? site.year : ''}">2026</span> tshow</p>
    </div>
</footer>

</body>
</html>
