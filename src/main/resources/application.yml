spring:
  application:
    name: tshow
  config:
    # 로컬 IntelliJ에서 실행할 때 프로젝트 루트의 .env 파일을 자동으로 읽어온다 (없어도 무방)
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    # 로컬 docker-compose.yml의 db 포트(5434:5432)를 기본값으로 사용한다 (운영은 DB_URL 환경변수로 주입)
    url: ${DB_URL:jdbc:postgresql://localhost:5434/tshow}
    username: ${DB_USERNAME:tshow}
    password: ${DB_PASSWORD:tshow}
  flyway:
    # 스키마는 db/migration 의 SQL 로만 바꾼다
    enabled: true
  jpa:
    hibernate:
      # Hibernate 는 스키마를 만들거나 바꾸지 않고, 시작할 때 엔티티와 맞는지만 확인한다
      ddl-auto: validate
    # 뷰 렌더링까지 DB 연결을 붙잡지 않는다 (트랜잭션은 서비스 계층에서 끝난다)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: Asia/Seoul
  thymeleaf:
    cache: ${SPRING_THYMELEAF_CACHE:false}
  web:
    resources:
      # 배포 후 강력 새로고침 없이도 수정된 CSS/JS 가 바로 반영되도록 파일 내용 해시를 URL 에 붙인다
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  ai:
    # 쓰는 것은 임베딩(OpenAI)뿐이다. 나머지 OpenAI 기능은 꺼서 키가 없어도 앱이 뜨게 한다
    model:
      chat: none
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      # 키가 비어 있으면 Spring AI 가 시작 단계에서 실패할 수 있어 자리표시 값을 둔다. 실제 사용 가능 여부는 tshow.index 에서 판단한다
      api-key: ${OPENAI_API_KEY:not-configured}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        # 벡터 크기를 줄여 저장 공간과 메모리를 아낀다. tshow.index.vector-dimensions 와 같아야 한다
        dimensions: 768
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        # 로컬 기본값은 tshow 의 docker-compose(6336). 운영은 deploy compose 가 6334 를 준다
        port: ${QDRANT_GRPC_PORT:6336}
        api-key: ${QDRANT_API_KEY:}
        use-tls: ${QDRANT_USE_TLS:false}
        # 이 설정은 Spring AI 벡터스토어용이다. tshow 는 tshow.index.collection-name 을 직접 쓴다
        collection-name: ${TSHOW_QDRANT_COLLECTION:tshow-events}
        initialize-schema: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  # 리버스 프록시(Nginx) 뒤에서 X-Forwarded-* 헤더를 신뢰해 https 주소로 리다이렉트/URL을 만든다
  forward-headers-strategy: framework

# 공공데이터 API 인증키 (data.go.kr 활용신청 후 발급). 값은 .env 로만 관리하고 커밋하지 않는다
kopis:
  api-key: ${KOPIS_API_KEY:}
tourapi:
  api-key: ${TOURAPI_API_KEY:}
culture:
  api-key: ${CULTURE_API_KEY:}

# 수집 설정. 주소·간격·재시도·범위는 코드가 아니라 여기서 조정한다.
tshow:
  ingest:
    # 오늘부터 몇 개월 앞까지 수집할지
    horizon-months: ${TSHOW_INGEST_HORIZON_MONTHS:6}
    # 이미 수집한 항목의 상세를 이 시간 안에는 다시 조회하지 않는다 (증분 수집)
    refetch-after-hours: 24
    # 앱 시작 때 바로 수집을 한 번 실행할지 (로컬 확인용). 운영은 cron 으로만 돌린다
    on-startup: ${TSHOW_INGEST_ON_STARTUP:false}
    cron: "0 0 3 * * *"
    zone: Asia/Seoul
    # TourAPI 호출에 필요한 서비스(앱) 이름
    app-name: tshow
    # 수집할 소스 (쉼표로 구분). 로컬에서 하나만 시험할 때 줄인다
    sources: ${TSHOW_INGEST_SOURCES:KOPIS,CULTURE,TOURAPI}
    kopis:
      base-url: http://www.kopis.or.kr/openApi/restful
      # KOPIS 는 조회 기간이 시작일+30일까지만 가능하다
      window-days: 30
      page-size: 100
      # 호출이 몰리면 400(Request Blocked)으로 일시 차단된다. 호출 사이 간격(ms)과 재시도
      interval-millis: 600
      max-retries: 4
      backoff-millis: 8000
      timeout-seconds: 30
    culture:
      base-url: http://apis.data.go.kr/B553457/cultureinfo
      # 기간 한도가 없어 한 번에 조회한다 (6개월 범위여도 한 구간)
      window-days: 400
      page-size: 100
      interval-millis: 200
      max-retries: 4
      backoff-millis: 5000
      timeout-seconds: 30
    tourapi:
      base-url: https://apis.data.go.kr/B551011/KorService2
      window-days: 400
      # 행사는 시작일 기준으로만 조회되므로 진행 중인 행사를 얻으려고 180일 전부터 조회하고 기간이 겹치는 것만 남긴다
      lookback-days: 180
      page-size: 100
      interval-millis: 200
      max-retries: 4
      backoff-millis: 5000
      timeout-seconds: 30
  # 소스 간 중복 판정과 필드 병합. 기준값과 소스 우선순위는 여기서 조정한다 (MergeProperties 설명 참고)
  merge:
    title-similarity: 0.85
    venue-similarity: 0.6
    max-distance-meters: 300
    date-tolerance-days: 0
    # 장소가 같을 때 한쪽 제목이 다른 쪽에 통째로 포함되면(부제 차이) 같은 제목으로 본다. 이 글자 수 이상일 때만
    contained-title-min-length: 8
    # 장소 이름·좌표가 안 맞아도 같은 시군구에서 제목이 이만큼 같으면 같은 행사로 본다 (같은 건물의 다른 이름)
    same-region-title-similarity: 0.95
    no-place-title-similarity: 1.0
    # 필드별 소스 우선순위: 앞의 소스 값을 우선 쓴다. 실측: TourAPI 소개글이 가장 풍부, KOPIS 가 가격·좌표·예매 링크가 정확
    priority:
      default: [KOPIS, CULTURE, TOURAPI]
      description: [TOURAPI, KOPIS, CULTURE]
      image: [KOPIS, TOURAPI, CULTURE]
      info-url: [CULTURE, TOURAPI, KOPIS]
      category: [KOPIS, TOURAPI, CULTURE]
  # 벡터 색인 (docs/index-design.md 2절). 컬렉션은 공용 Qdrant 안에서 tshow 전용 이름을 쓴다
  index:
    collection-name: ${TSHOW_QDRANT_COLLECTION:tshow-events}
    vector-dimensions: 768
    # 임베딩 호출 한 번에 보낼 문장 수
    batch-size: 64
    # 임베딩 텍스트에 넣을 설명의 최대 글자 수 (길면 앞부분만)
    description-max-chars: 600
    # 임베딩 텍스트 모양. {필드} 자리를 채우고, 값이 없는 줄은 뺀다
    embedding-template: index/embedding.tpl
    # false 로 두면 수집 뒤 색인 단계를 건너뛴다
    enabled: true
  # 종료 후 보관 기간(일). 지나면 Postgres 는 논리삭제, Qdrant 는 물리삭제 (docs/index-design.md)
  retention:
    days: 30

  # 검색 설정. 점수 하한·후보 수·화면 크기는 여기서 조정한다 (SearchProperties 설명 참고)
  search:
    candidate-limit: 60
    # 벡터 유사도가 이 값보다 낮은 후보는 관련 없는 것으로 보고 버린다 (실제 점수 분포를 보고 정한다)
    min-score: 0.3
    page-size: 12
    # 검색어는 이 글자 수까지만 쓴다 (임베딩 호출 비용과 남용 방지)
    max-query-length: 100
    default-radius-km: 5
    # 출처 표기에 쓸 이름. 각 서비스의 이용 조건에 맞는 표기를 쓴다
    source-names:
      KOPIS: 공연예술통합전산망(KOPIS)
      CULTURE: 한국문화정보원
      TOURAPI: 한국관광공사
