# 지역 이름 별칭. regions.csv(공식 코드표)의 이름과 이름 규칙(접미사 제거)으로 풀리지 않는 값만 적는다.
# 키는 소스에서 온 시도 이름, 값은 regions.csv 의 sido_code. 새로 풀리지 않는 값이 보고되면 여기에 추가한다.
sido:
  "광주": "12"        # 광주광역시가 전남광주통합특별시로 통합됨
  "광주광역시": "12"
  "전남": "12"
  "전라남도": "12"
  "전남광주": "12"
  "세종": "36110"
  "세종시": "36110"
  "강원": "51"
  "전북": "52"
  # 줄임말 (이름 규칙으로는 풀 수 없다)
  "경남": "48"
  "경북": "47"
  "충남": "44"
  "충북": "43"

# 화면에 보일 짧은 시도 이름. 이름 규칙(접미사 제거)으로 줄이면 어색한 것(충청남도→충청남)만 적는다. 키는 시도 코드
short-names:
  "43": 충북
  "44": 충남
  "47": 경북
  "48": 경남

# 시군구 이름이 바뀌어 소스가 옛 이름을 주는 경우. 시도 코드 → { 소스 이름: 현재 이름 }
sigungu:
  "28":
    "남구": "미추홀구"   # 인천 남구 → 미추홀구

# 해외·미상 등 한국 지역이 아닌 값 (오류가 아니라 지역 없음으로 저장한다)
non-domestic:
  - "해외"
