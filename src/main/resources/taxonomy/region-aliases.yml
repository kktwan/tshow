  "전남": "12"
  "전라남도": "12"
  "전남광주": "12"
  "세종": "36110"
  "세종시": "36110"
  "강원": "51"
  "전북": "52"

# 해외·미상 등 한국 지역이 아닌 값 (오류가 아니라 지역 없음으로 저장한다)
non-domestic:
