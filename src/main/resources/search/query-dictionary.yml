# 검색어에서 조건을 뽑아내는 사전. 새 표현은 코드가 아니라 이 파일에 추가한다.
# 뽑아낸 표현은 검색 문장에서 빠지고, 남은 문장만 의미 검색(임베딩)에 쓰인다. 긴 표현이 먼저 맞는다.

# 날짜 표현. 키는 규칙 이름이고, 규칙의 계산은 코드(DateRule)에 있다. 첫 번째 표현이 화면 버튼 이름으로 쓰인다.
dates:
  today: [오늘]
  tomorrow: [내일]
  weekend: [이번 주말, 이번주말, 주말]
  next-weekend: [다음 주말, 다음주말]
  this-week: [이번 주, 이번주]
  this-month: [이번 달, 이번달, 이달]
  next-month: [다음 달, 다음달]

# 가격 표현 (무료만 보기)
free: [무료, 공짜]

# 종류 표현 (categories.yml 의 kinds 키)
kinds:
  PERFORMANCE: [공연]

# 표준 분류 표현 (categories.yml 의 categories id)
categories:
  theater: [연극]
  musical: [뮤지컬, 오페라]
  classical: [클래식, 오케스트라, 교향악]
  traditional: [국악, 전통공연]
  concert: [콘서트, 대중음악]
  dance: [무용, 발레]
  family: [아동극, 어린이극, 가족극]
  exhibition: [전시회, 전시, 미술관, 갤러리]
  festival: [축제, 페스티벌]
  expo: [박람회]
  sports: [스포츠 경기]

# 지역 이름 뒤에 붙을 수 있는 조사·말 (서울에서, 강남구의, 부산 근처)
region-particles: [에서, 에서의, 에, 의, 으로, 로, 근처, 인근, 쪽, 지역, 일대]

# 의미 검색에 도움이 되지 않는 말투·군더더기 (검색 문장에서 뺀다)
fillers: [열리는, 있는, 추천해줘, 추천해 줘, 추천해주세요, 추천, 알려줘, 알려 줘, 보여줘, 보여 줘, 찾아줘, 찾아 줘, 있어요, 있나요, 있어, 있나, 하는, 갈 만한, 갈만한, 볼 만한, 볼만한, 좀, 곳, 거]
